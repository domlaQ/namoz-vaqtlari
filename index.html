<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namoz Vaqtlari - Ettichinor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f0f7ff, #e0f0ff);
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        .header img {
            width: 32px;
            height: 32px;
            vertical-align: middle;
            margin-right: 8px;
        }
        .header h1 {
            display: inline-block;
            margin: 0;
            color: #1e88e5;
            font-size: 2.1em;
        }
        h2 {
            text-align: center;
            color: #555;
            margin: 8px 0 25px 0;
        }
        .prayer-time {
            background: #f8fbff;
            padding: 15px;
            margin: 12px 0;
            border-radius: 8px;
            border-left: 5px solid #1e88e5;
            font-size: 1.1em;
        }
        .setting-box {
            background: #f8fbff;
            padding: 20px;
            margin: 25px 0;
            border-radius: 10px;
            text-align: center;
        }
        input[type="number"] {
            width: 80px;
            padding: 10px;
            font-size: 1.3em;
            text-align: center;
            border: 2px solid #1e88e5;
            border-radius: 8px;
        }
        button {
            background: #1e88e5;
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
        button:hover { background: #1565c0; }
        .status { 
            text-align: center; 
            margin: 15px 0; 
            font-weight: bold; 
            color: #1e88e5; 
        }
        audio { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Kichik masjid ikonasi + Sarlavha -->
        <div class="header">
            <img src="https://i.imgur.com/8zJ0z3K.png" alt="Masjid">
            <h1>Namoz Vaqtlari</h1>
        </div>
        
        <h2>Ettichinor Jome' Masjidi</h2>

        <div id="prayerTimes"></div>

        <div class="setting-box">
            <h2>Azonni oldindan eshitish</h2>
            <p>Namoz vaqtidan nechta minut oldin azon aytishni xohlaysiz? (0 dan 20 minutgacha)</p>
            
            <input type="number" id="minutesBefore" min="0" max="20" value="10">
            <span style="font-size:1.2em;"> minut oldin</span><br><br>
            
            <button onclick="saveSettings()">Sozlamani Saqlash</button>
        </div>

        <div class="status" id="status"></div>
        <audio id="azonAudio" preload="auto"></audio>
    </div>

<script>
let prayerTimes = {};
let minutesBefore = 10;

const prayers = [
    { name: "Bomdod", audio: "bomdod_azoni.mp3" },
    { name: "Peshin", audio: "azon.mp3" },
    { name: "Asr",    audio: "azon.mp3" },
    { name: "Shom",   audio: "azon.mp3" },
    { name: "Xufton", audio: "azon.mp3" }
];

fetch('data.json')
    .then(res => res.json())
    .then(data => {
        prayerTimes = data.masjidlar[0].vaqtlar;
        loadSettings();
        renderPrayerTimes();
        startChecker();
    });

function renderPrayerTimes() {
    let html = '<h2>Bugungi namoz vaqtlari</h2>';
    Object.keys(prayerTimes).forEach(name => {
        html += `<div class="prayer-time"><strong>${name}</strong> — ${prayerTimes[name]}</div>`;
    });
    document.getElementById('prayerTimes').innerHTML = html;
}

function saveSettings() {
    const input = document.getElementById('minutesBefore');
    minutesBefore = parseInt(input.value) || 0;
    if (minutesBefore > 20) minutesBefore = 20;
    if (minutesBefore < 0) minutesBefore = 0;

    localStorage.setItem('minutesBefore', minutesBefore);
    document.getElementById('status').innerHTML = '✅ Sozlama saqlandi!';
    setTimeout(() => document.getElementById('status').innerHTML = '', 3000);
}

function loadSettings() {
    const saved = localStorage.getItem('minutesBefore');
    if (saved) {
        minutesBefore = parseInt(saved);
        document.getElementById('minutesBefore').value = minutesBefore;
    }
}

function startChecker() {
    setInterval(checkForAzon, 30000);
    checkForAzon();
}

function checkForAzon() {
    if (minutesBefore <= 0) return;
    const now = new Date();
    const currentTotalMin = now.getHours() * 60 + now.getMinutes();

    prayers.forEach(prayer => {
        const prayerTimeStr = prayerTimes[prayer.name];
        if (!prayerTimeStr) return;
        const [h, m] = prayerTimeStr.split(':').map(Number);
        const prayerTotalMin = h * 60 + m;

        if (currentTotalMin === prayerTotalMin - minutesBefore) {
            playAzon(prayer.audio, prayer.name);
        }
    });
}

function playAzon(audioFile, prayerName) {
    const audio = document.getElementById('azonAudio');
    audio.src = audioFile;
    audio.play().catch(() => {});
}
</script>
</body>
</html>
