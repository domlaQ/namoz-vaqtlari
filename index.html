<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namoz Vaqtlari - Ettichinor Jome' Masjidi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f0f7ff, #e0f0ff);
            margin: 0;
            padding: 15px;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #1e88e5;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .prayer-time {
            background: #f8fbff;
            padding: 12px;
            margin: 12px 0;
            border-radius: 8px;
            border-left: 5px solid #1e88e5;
        }
        .settings {
            margin-top: 25px;
        }
        label {
            display: block;
            margin: 12px 0;
            font-size: 1.05em;
        }
        input[type="number"] {
            width: 70px;
            padding: 8px;
            font-size: 1em;
            border: 1px solid #1e88e5;
            border-radius: 6px;
        }
        button {
            background: #1e88e5;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
        button:hover {
            background: #1565c0;
        }
        .status {
            text-align: center;
            margin-top: 15px;
            font-size: 0.95em;
            color: #666;
        }
        audio {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🕌 Namoz Vaqtlari</h1>
        <h2 style="text-align:center; color:#555;">Ettichinor Jome' Masjidi</h2>
        
        <div id="prayerTimes"></div>

        <div class="settings">
            <h2>Azonni oldindan eshitish</h2>
            <p style="color:#555; font-size:0.95em;">Har bir namoz uchun nechta minut oldin azon aytishni xohlaysiz? (0 = o'chirish)</p>
            <div id="settings"></div>
        </div>

        <button onclick="saveSettings()">Sozlamalarni Saqlash</button>
        
        <div class="status" id="status">Sozlamalar saqlanmagan</div>
        
        <audio id="azonAudio" preload="auto"></audio>
    </div>

<script>
// Ma'lumotlar
let prayerTimes = {};
let userSettings = {};

const prayers = [
    { name: "Bomdod", audio: "bomdod_azoni.mp3" },
    { name: "Peshin", audio: "azon.mp3" },
    { name: "Asr",    audio: "azon.mp3" },
    { name: "Shom",   audio: "azon.mp3" },
    { name: "Xufton", audio: "azon.mp3" }
];

// data.json dan yuklash
fetch('data.json')
    .then(response => response.json())
    .then(data => {
        prayerTimes = data.masjidlar[0].vaqtlar;
        loadSavedSettings();
        renderPrayerTimes();
        renderSettings();
        startChecker();
    })
    .catch(err => {
        console.error(err);
        document.getElementById('prayerTimes').innerHTML = "<p style='color:red;text-align:center;'>data.json yuklanmadi!</p>";
    });

function renderPrayerTimes() {
    let html = '<h2 style="margin-top:20px;">Bugungi namoz vaqtlari</h2>';
    Object.keys(prayerTimes).forEach(name => {
        html += `
            <div class="prayer-time">
                <strong>${name}</strong> — ${prayerTimes[name]}
            </div>`;
    });
    document.getElementById('prayerTimes').innerHTML = html;
}

function renderSettings() {
    let html = '';
    prayers.forEach(prayer => {
        const time = prayerTimes[prayer.name] || '--:--';
        const savedMin = userSettings[prayer.name] !== undefined ? userSettings[prayer.name] : 0;
        
        html += `
            <div class="prayer-time">
                <strong>${prayer.name} — ${time}</strong><br><br>
                <label>
                    Azonni 
                    <input type="number" id="${prayer.name}_min" 
                           value="${savedMin}" min="0" max="60">
                    minut oldin aytish
                </label>
            </div>`;
    });
    document.getElementById('settings').innerHTML = html;
}

function saveSettings() {
    prayers.forEach(prayer => {
        const input = document.getElementById(prayer.name + '_min');
        let minutes = parseInt(input.value);
        if (isNaN(minutes) || minutes < 0) minutes = 0;
        if (minutes > 60) minutes = 60;
        userSettings[prayer.name] = minutes;
    });

    localStorage.setItem('azanSettings', JSON.stringify(userSettings));
    document.getElementById('status').innerHTML = '✅ Sozlamalar saqlandi!';
    setTimeout(() => {
        document.getElementById('status').innerHTML = '';
    }, 3000);
}

function loadSavedSettings() {
    const saved = localStorage.getItem('azanSettings');
    if (saved) {
        userSettings = JSON.parse(saved);
    }
}

function startChecker() {
    setInterval(checkForAzon, 30000); // har 30 sekundda tekshirish
    checkForAzon(); // darhol tekshirish
}

function checkForAzon() {
    const now = new Date();
    const currentTotalMin = now.getHours() * 60 + now.getMinutes();

    prayers.forEach(prayer => {
        const minutesBefore = userSettings[prayer.name];
        if (!minutesBefore || minutesBefore <= 0) return;

        const prayerTime = prayerTimes[prayer.name];
        if (!prayerTime) return;

        const [h, m] = prayerTime.split(':').map(Number);
        const prayerTotalMin = h * 60 + m;

        if (currentTotalMin === prayerTotalMin - minutesBefore) {
            playAzon(prayer.audio, prayer.name);
        }
    });
}

function playAzon(audioFile, prayerName) {
    const audio = document.getElementById('azonAudio');
    audio.src = audioFile;
    audio.play().then(() => {
        console.log(`${prayerName} uchun azon chalindi!`);
    }).catch(err => {
        console.log("Audio ijro etilmadi:", err);
    });
}

// Sahifa yuklanganda
window.onload = () => {
    // agar kerak bo'lsa qo'shimcha kod
};
</script>
</body>
</html>
